# Slim CI: on every pull request, build and test only the models changed vs main,
# in a throwaway schema CI_PR_<number>, reading unchanged upstream models from PROD (--defer).
name: dbt-ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: dbt-ci-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_USER: ${{ secrets.DBT_USER }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSPHRASE: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}
      DBT_ENV_NAME: CI_PR_${{ github.event.number }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout main (to produce the prod state)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: pr
        run: uv sync --frozen

      - name: Build prod manifest from main
        working-directory: main/airbnb
        run: |
          ../../pr/.venv/bin/dbt deps
          ../../pr/.venv/bin/dbt compile --target prod --profiles-dir _prod_profiles --target-path ../../target-prod

      - name: Build and test modified models
        working-directory: pr/airbnb
        run: |
          ../.venv/bin/dbt deps
          ../.venv/bin/dbt build --target dev --profiles-dir _prod_profiles \
            --select state:modified+ --defer --state ../../target-prod

      - name: Drop the CI schema
        if: always()
        working-directory: pr/airbnb
        run: ../.venv/bin/dbt run-operation drop_dev_schemas --target dev --profiles-dir _prod_profiles
